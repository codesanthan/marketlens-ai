steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/web/Dockerfile, '--build-arg=API_BASE_URL=${_API_URL}', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/marketlens/web:$COMMIT_SHA', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/marketlens/web:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, marketlens-web, '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/marketlens/web:$COMMIT_SHA', '--region=${_REGION}', '--platform=managed', '--service-account=marketlens-web@$PROJECT_ID.iam.gserviceaccount.com', '--min-instances=0', '--set-env-vars=API_BASE_URL=${_API_URL}', --allow-unauthenticated]
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/marketlens/web:$COMMIT_SHA']
substitutions: {_REGION: us-central1, _API_URL: http://localhost:8000}

