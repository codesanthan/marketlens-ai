[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "packages/connectors/yahoo/tests", "packages/connectors/sec/tests"]
addopts = "--cov=apps.api --cov=packages.connectors --cov-report=term-missing --cov-fail-under=80"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017", "UP041"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
