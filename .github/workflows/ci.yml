name: CI
on: [pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check apps packages tests
      - run: mypy apps packages
      - run: pytest
      - run: docker build -f apps/api/Dockerfile -t marketlens-api:test .
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: pnpm/action-setup@v4
        with: {version: 11}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -f apps/web/Dockerfile -t marketlens-web:test ../..
